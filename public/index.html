<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flora</title>
    <link rel="icon" type="image/x-icon" href="./imagenes/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styleSheet.css">
</head>

<body>
    <div class="container border-top border-bottom marcoPrin min-vh-100 d-flex flex-column" >

        <header>
            <h1 class="text-center fw-bold">Floristería Flora</h1>
        </header>

        <nav> 
            <ul>
                <li><a href="index.html" class="text-decoration-none">Menú</a></li>
                <li>
                    <a href="#" class="text-decoration-none" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
                        Carro de la compra
                    </a>
                </li>
            </ul>
        </nav>
            
        <div class="row"> 
            <main class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 id="titulo-producto">Buscando por: </h2>
                    <input type="text" id="buscador" class="form-control w-25" placeholder="Buscar productos...">
                </div>
                
                <div id="contenedorProductos" class="row row-cols-3 g-4">
                </div>

                <div id="modal" class="modal" style="display: none;">
                    <div class="modal-contenido">
                        <h2 id="tituloModal"></h2>
                        <hr>
                        <div class="info-cuerpo">
                            <div class="row"> 
                                <div class="col-md-4">
                                    <img id="modal-imagen" src="" alt="">
                                </div>
                                <div class="col-md-8">
                                    <h3 class="text-center" id="NombreProductoModal"></h3>
                                    <p><strong>Precio: </strong><span id="PrecioProductoModal"></span></p>
                                    <p><strong>Campo extra: </strong><span id="ExtraProductoModal"></span></p>
                                    <p><strong>Descripcion: </strong><span id="Descripcion"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <nav class="mt-4">
                    <ul id="paginacion" class="pagination pagination-sm justify-content-center"></ul>
                </nav>
            </main>

            <aside class="col-md-4">
                <form id="FormularioProd">
                    <h2>Añadir Productos</h2>

                    <select id="categoria" name="categoria" class="form-control mb-2">
                        <option value="Flor">Flores</option>
                        <option value="Ramo">Ramos</option>
                        <option value="Planta">Plantas</option>
                        <option value="Accesorio">Accesorios</option>
                        <option value="Regalo">Regalos</option>
                    </select>

                    <input type="text" id="NombreProducto" name="NombreProducto" placeholder="Nombre" class="form-control mb-2" required/>
                    <input type="number" id="precioProducto" name="precioProducto" placeholder="Precio" class="form-control mb-2" required>
                    <textarea id="descripcion" name="descripcion" placeholder="Descripción" class="form-control mb-2" required></textarea>  
                    <div id="contenedorExtra" style="display: none;"> <input type="text" id="atributoExtra" name="atributoExtra" placeholder="Atributo extra" class="form-control mb-2"></div>
                    <input type="file" id="fileselect" multiple class="form-control mb-2"> 
                    <div id="dropbox" class="form-control mb-2 text-center text-muted" style="height: 50px;"> arrastra aquí los ficheros</div> 
                    <button type="submit" class="form-control mb-2 btn btn-primary">Enviar</button>
                </form>
                
                </aside>

        <footer class="text-black text-center ">
            Floristería Flora 
        </footer>

    </div>  
    
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="carritoLabel">Carrito de la compra</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div id="contenidoCarrito">
            <p class="text-center text-muted">El carrito está vacío</p>
        </div>
        <div class="mt-3 border-top pt-2">
            <h4>Total: <span id="totalCarrito">0€</span></h4>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/añadirProductos.js"></script>
    <script type="module" src="js/atributoExtra.js"> </script>
</body>
</html>
